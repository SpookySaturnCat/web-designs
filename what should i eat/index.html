<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Should I Eat?</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <header>
            <h1>What Should I Eat?</h1>
            <p>I am hungry. I don't want to think. You decide.</p>
        </header>

        <!-- Cuisine Selection -->
        <section class="question">
            <h2>What are you in the mood for?</h2>

            <div class="button-group">
                <button class="choice-button"
                        data-cuisine="japanese">
                    Japanese
                </button>
                <button class="choice-button"
                        data-cuisine="italian">
                    Italian
                </button>
                <button class="choice-button"
                        data-cuisine="indian">
                    Indian
                </button>
                 <button class="choice-button"
                        data-cuisine="korean">
                    Korean
                </button>
                 <button class="choice-button"
                        data-cuisine="american">
                    American
                </button>
                 <button class="choice-button"
                        data-cuisine="chinese">
                    Chinese
                </button>
                 <button class="choice-button"
                        data-cuisine="greek">
                    Greek
                </button>
                 <button class="choice-button"
                        data-cuisine="junk">
                    Junk
                </button>
                 <button class="choice-button"
                        data-cuisine="healthy">
                    Healthy
                </button>

                <button class="choice-button"
                        data-cuisine="any">
                    Anything
                </button>
            </div>
        </section>

        <!-- Effort Selection -->
        <section class="question">
            <h2>How much effort do you want to put in?</h2>

            <div class="button-group">
                <button class="choice-button"
                        data-effort="easy">
                    Bare Minimum
                </button>
                <button class="choice-button"
                        data-effort="medium">
                    Some Effort
                </button>
                <button class="choice-button"
                        data-effort="hard">
                    Highest Potential
                </button>
                <button class="choice-button"
                        data-effort="any">
                    Doesn't Matter
                </button>
            </div>
        </section>

        <!-- Budget Selection -->
        <section class="question">
            <h2>What is the budget?</h2>

            <div class="button-group">
                <button class="choice-button"
                        data-budget="cheap">
                    Cheap
                </button>
                <button class="choice-button"
                        data-budget="normal">
                    Normal
                </button>
                <button class="choice-button"
                        data-budget="expensive">
                    Expensive
                </button>
                <button class="choice-button"
                        data-budget="any">
                    Don't Care
                </button>
            </div>
        </section>

        <!-- Decide Button - automatically disaabled until json loads-->
        <button id="decideButton" disabled>
            TELL ME WHAT TO EAT
        </button>

        <!-- Results -->
        <section id="result">
            <h2 id="mealName">Your meal will appear here...</h2>

            <div id="mealInfo">
                <p id="mealTime"></p>
                <p id="mealBudget"></p>
                <p id="mealEffort"></p>
                <p id="mealProtien"><</p>
            </div>

            <h3>Ingredients</h3>
            <ul id="ingredients"></ul>
        </section>
    </main>
</body>
</html>
