<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Apothecary</title>

  <link rel="icon" type="image/png" href="images/me.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="App.js" defer></script>
</head>
<body>

  <main class="container">
    <header class="header-content">
      <div class="title-row">
        <img src="images/me.png" alt="Apothecary Witch" class="witch-img">
        
        <div class="text-block">
          <h1 class="main-title">Welcome to the digital apothecary</h1>
          <p class="subtitle">DRAG YOUR MOUSE OVER THE STARS TO SHOP</p>
        </div>
      </div>
    </header>

    <div class="star-card">
      <div id="grid"></div>
    </div>

    <button id="reset-btn" type="button">Cleanse the Stars</button>
  </main>

</body>
</html>
